# Blueprint do Render: o site como Static Site (grátis, sem hibernar, CDN).
# Deploy automático a cada push no branch configurado no Render. Os preços da
# Liga seguem vindo do PC (scripts/serve.py --publish faz o push do JSON).
services:
  - type: web
    name: emerald-tcg
    runtime: static
    branch: main
    buildCommand: sh scripts/build_static.sh
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # Segurança em todas as páginas (a CSP de scripts fica numa <meta> no src/index.html, que também
      # vale no GitHub Pages; frame-ancestors só funciona em cabeçalho, por isso está aqui).
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Artes e miniaturas mudam pouco: 1 semana de cache no navegador
      - path: /assets/art/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/thumbs/*
        name: Cache-Control
        value: public, max-age=604800
      # Catálogo e preços mudam todo dia: sempre revalida
      - path: /assets/data/*
        name: Cache-Control
        value: no-cache
      - path: /src/*
        name: Cache-Control
        value: no-cache
